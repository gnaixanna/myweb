    /* ---------------- CALENDAR ---------------- */

    .calendar-header {
      width: 350px;
      display: flex;
      justify-content: space-between;

      margin-top: 25px;
      margin-bottom: 15px;

    .calendar-header button {

    .calendar-weekdays {

<script>

  /* =====================================================
     DEFAULT DAILY ROUTINE
     ===================================================== */

  const defaultTasks = [

    "Gmail",

    "Language Bird Mailbox",

    "Pronto",

    "Check all courses page to ensure no missed task"

  ];


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const calendarDays =
    document.getElementById("calendarDays");

  const monthTitle =
    document.getElementById("monthTitle");

  const selectedDateTitle =
    document.getElementById("selectedDateTitle");

  const todoList =
    document.getElementById("todoList");

  const newTaskInput =
    document.getElementById("newTaskInput");

  const addTaskButton =
    document.getElementById("addTaskButton");

  const prevMonth =
    document.getElementById("prevMonth");

  const nextMonth =
    document.getElementById("nextMonth");


  /* =====================================================
     DATE
     ===================================================== */

  const today = new Date();

  let displayedYear =
    today.getFullYear();

  let displayedMonth =
    today.getMonth();

  let selectedDate =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


  function dateKey(date) {

    const year =
      date.getFullYear();

    const month =
      String(
        date.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        date.getDate()
      ).padStart(2, "0");

    return `${year}-${month}-${day}`;

  }


  /* =====================================================
     STORAGE
     ===================================================== */

  function getTasks(date) {

    const key =
      "dailyTodos:" + dateKey(date);

    const saved =
      localStorage.getItem(key);


    /*
      If this date has never been opened before,
      automatically create the normal daily routine.
    */

    if (saved === null) {

      const tasks =
        defaultTasks.map(text => ({

          text: text,
          completed: false

        }));

      saveTasks(date, tasks);

      return tasks;

    }


    return JSON.parse(saved);

  }


  function saveTasks(date, tasks) {

    const key =
      "dailyTodos:" + dateKey(date);

    localStorage.setItem(
      key,
      JSON.stringify(tasks)
    );

  }


  /* =====================================================
     TODO LIST
     ===================================================== */

  function renderTodos() {

    selectedDateTitle.textContent =
      selectedDate.toLocaleDateString(
        "en-US",
        {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );


    todoList.innerHTML = "";


    const tasks =
      getTasks(selectedDate);


    tasks.forEach(
      (task, index) => {


        const row =
          document.createElement("div");

        row.className =
          "todo-item";


        if (task.completed) {

          row.classList.add(
            "completed"
          );

        }


        /* CHECKBOX */

        const checkbox =
          document.createElement("input");

        checkbox.type =
          "checkbox";

        checkbox.checked =
          task.completed;


        checkbox.addEventListener(
          "change",
          () => {

            const tasks =
              getTasks(selectedDate);

            tasks[index].completed =
              checkbox.checked;

            saveTasks(
              selectedDate,
              tasks
            );

            renderTodos();

          }
        );


        /* EDITABLE TASK TEXT */

        const textInput =
          document.createElement("input");

        textInput.type =
          "text";

        textInput.className =
          "todo-text";

        textInput.value =
          task.text;


        textInput.addEventListener(
          "input",
          () => {

            const tasks =
              getTasks(selectedDate);

            tasks[index].text =
              textInput.value;

            saveTasks(
              selectedDate,
              tasks
            );

          }
        );


        /* DELETE */

        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-task";

        deleteButton.textContent =
          "×";


        deleteButton.addEventListener(
          "click",
          () => {

            const tasks =
              getTasks(selectedDate);

            tasks.splice(
              index,
              1
            );

            saveTasks(
              selectedDate,
              tasks
            );

            renderTodos();

          }
        );


        row.appendChild(
          checkbox
        );

        row.appendChild(
          textInput
        );

        row.appendChild(
          deleteButton
        );


        todoList.appendChild(
          row
        );

      }
    );

  }


  /* =====================================================
     ADD TASK
     ===================================================== */

  function addTask() {

    const text =
      newTaskInput.value.trim();


    if (!text) {
      return;
    }


    const tasks =
      getTasks(selectedDate);


    tasks.push({

      text: text,
      completed: false

    });


    saveTasks(
      selectedDate,
      tasks
    );


    newTaskInput.value =
      "";


    renderTodos();


    newTaskInput.focus();

  }


  addTaskButton.addEventListener(
    "click",
    addTask
  );


  newTaskInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        addTask();

      }

    }
  );


  /* =====================================================
     CALENDAR
     ===================================================== */

  function renderCalendar() {

    calendarDays.innerHTML =
      "";


    monthTitle.textContent =
      new Date(
        displayedYear,
        displayedMonth,
        1
      ).toLocaleDateString(
        "en-US",
        {
          month: "long",
          year: "numeric"
        }
      );


    const firstDay =
      new Date(
        displayedYear,
        displayedMonth,
        1
      );


    const daysInMonth =
      new Date(
        displayedYear,
        displayedMonth + 1,
        0
      ).getDate();


    /*
      JavaScript:
      Sunday = 0
      Monday = 1

      Calendar here starts Monday.
    */

    const startingPosition =
      (firstDay.getDay() + 6) % 7;


    /* EMPTY CELLS */

    for (
      let i = 0;
      i < startingPosition;
      i++
    ) {

      const empty =
        document.createElement("div");

      empty.className =
        "calendar-day empty";

      calendarDays.appendChild(
        empty
      );

    }


    /* DAYS */

    for (
      let day = 1;
      day <= daysInMonth;
      day++
    ) {

      const date =
        new Date(
          displayedYear,
          displayedMonth,
          day
        );


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "calendar-day";

      button.textContent =
        day;


      /* TODAY */

      if (
        dateKey(date) ===
        dateKey(today)
      ) {

        button.classList.add(
          "today"
        );

      }


      /* SELECTED DAY */

      if (
        dateKey(date) ===
        dateKey(selectedDate)
      ) {

        button.classList.add(
          "selected"
        );

      }


      /* CLICK DATE */

      button.addEventListener(
        "click",
        () => {

          selectedDate =
            new Date(
              displayedYear,
              displayedMonth,
              day
            );

          renderCalendar();

          renderTodos();

        }
      );


      calendarDays.appendChild(
        button
      );

    }

  }


  /* =====================================================
     PREVIOUS MONTH
     ===================================================== */

  prevMonth.addEventListener(
    "click",
    () => {

      displayedMonth--;


      if (displayedMonth < 0) {

        displayedMonth = 11;

        displayedYear--;

      }


      selectedDate =
        new Date(
          displayedYear,
          displayedMonth,
          1
        );


      renderCalendar();

      renderTodos();

    }
  );


  /* =====================================================
     NEXT MONTH
     ===================================================== */

  nextMonth.addEventListener(
    "click",
    () => {

      displayedMonth++;


      if (displayedMonth > 11) {

        displayedMonth = 0;

        displayedYear++;

      }


      selectedDate =
        new Date(
          displayedYear,
          displayedMonth,
          1
        );


      renderCalendar();

      renderTodos();

    }
  );

  /* =====================================================
   BACKUP / RESTORE
   ===================================================== */

const backupButton =
  document.getElementById("backupButton");

const restoreButton =
  document.getElementById("restoreButton");

const restoreFile =
  document.getElementById("restoreFile");

const lastBackup =
  document.getElementById("lastBackup");


function updateLastBackupDisplay() {

  const savedTime =
    localStorage.getItem("utilityLastBackupTime");

  if (!savedTime) {
    lastBackup.textContent = "No backup yet.";
    return;
  }

  const date = new Date(savedTime);

  lastBackup.textContent =
    "Last backup: " +
    date.toLocaleString();
}


/* ---------------- BACKUP ---------------- */

backupButton.addEventListener(
  "click",
  () => {

    const storage = {};

    for (
      let i = 0;
      i < localStorage.length;
      i++
    ) {

      const key =
        localStorage.key(i);

      if (
        key &&
        (
          key.startsWith("dailyTodos:") ||
          key.startsWith("weeklyTodos:")
        )
      ) {

        storage[key] =
          localStorage.getItem(key);

      }

    }


    const backupTime =
      new Date().toISOString();


    const backupData = {

      version: 2,

      backupAt:
        backupTime,

      storage:
        storage

    };


    const blob =
      new Blob(
        [
          JSON.stringify(
            backupData,
            null,
            2
          )
        ],
        {
          type: "application/json"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const downloadLink =
      document.createElement("a");


    const now =
      new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");


    downloadLink.href =
      url;

    downloadLink.download =
      `utility-backup-${year}-${month}-${day}.json`;


    document.body.appendChild(
      downloadLink
    );

    downloadLink.click();

    downloadLink.remove();

    URL.revokeObjectURL(url);


    localStorage.setItem(
      "utilityLastBackupTime",
      backupTime
    );


    updateLastBackupDisplay();

  }
);


/* ---------------- RESTORE BUTTON ---------------- */

restoreButton.addEventListener(
  "click",
  () => {

    restoreFile.click();

  }
);


/* ---------------- RESTORE FILE ---------------- */

restoreFile.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        try {

          const backupData =
            JSON.parse(
              e.target.result
            );


          if (
            !backupData.storage ||
            typeof backupData.storage !== "object"
          ) {

            alert(
              "This does not look like a valid Utility backup."
            );

            return;

          }


          Object.entries(
            backupData.storage
          ).forEach(
            ([key, value]) => {

              if (
                key.startsWith("dailyTodos:") ||
                key.startsWith("weeklyTodos:")
              ) {

                localStorage.setItem(
                  key,
                  value
                );

              }

            }
          );


          if (backupData.backupAt) {

            localStorage.setItem(
              "utilityLastBackupTime",
              backupData.backupAt
            );

          }


          updateLastBackupDisplay();

          renderCalendar();

          renderTodos();

          renderWeekLabel();

          renderWeeklyTodos();


          alert(
            "Backup restored."
          );


        } catch (error) {

          alert(
            "The backup file could not be read."
          );

        }

      };


    reader.readAsText(file);

    restoreFile.value = "";

  }
);


updateLastBackupDisplay();



/* ---------------- RESTORE BUTTON ---------------- */

restoreButton.addEventListener(
  "click",
  () => {

    restoreFile.click();

  }
);

              ) {
    
                alert(
                  "This does not look like a valid Utility backup."
                );
    
                return;
    
              }
    
    
              /*
                Restore each day's todo list.
              */
    
              Object.entries(
                backupData.todos
              ).forEach(
                ([date, tasks]) => {
    
                  localStorage.setItem(
    
                    "dailyTodos:" + date,
    
                    JSON.stringify(tasks)
    
                  );
    
                }
              );
    
    
              /*
                Restore backup timestamp too.
              */
    
              if (backupData.backupAt) {
    
                localStorage.setItem(
                  "utilityLastBackupTime",
                  backupData.backupAt
                );
    
              }
    
    
              updateLastBackupDisplay();
    
              renderCalendar();
    
              renderTodos();
    
    
              alert(
                "Backup restored."
              );
    
    
            } catch (error) {
    
              alert(
                "The backup file could not be read."
              );
    
            }
    
          };
    
    
        reader.readAsText(file);
    
    
        /*
          Allows selecting the same backup file
          again later.
        */
    
        restoreFile.value = "";
    
      }
    );
    
    
    
    updateLastBackupDisplay();

  /* =====================================================
   ON THE MOVE — WEEKLY TODO
   ===================================================== */

const weeklyTodoList =
  document.getElementById("weeklyTodoList");

const newWeeklyTaskInput =
  document.getElementById("newWeeklyTaskInput");

const addWeeklyTaskButton =
  document.getElementById("addWeeklyTaskButton");

const weekLabel =
  document.getElementById("weekLabel");


/*
  Find Monday of the week containing a date.
*/

function getMonday(date) {

  const result =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

  const day =
    result.getDay();

  const difference =
    day === 0
      ? -6
      : 1 - day;

  result.setDate(
    result.getDate() + difference
  );

  return result;

}


/*
  Each week gets its own storage key.

  Example:
  weeklyTodos:2026-08-17
*/

function weeklyKey() {

  const monday =
    getMonday(new Date());

  return (
    "weeklyTodos:" +
    dateKey(monday)
  );

}


function getWeeklyTasks() {

  const saved =
    localStorage.getItem(
      weeklyKey()
    );

  if (!saved) {
    return [];
  }

  try {

    return JSON.parse(saved);

  } catch (error) {

    return [];

  }

}


function saveWeeklyTasks(tasks) {

  localStorage.setItem(
    weeklyKey(),
    JSON.stringify(tasks)
  );

}


/* ---------------- WEEK LABEL ---------------- */

function renderWeekLabel() {

  const monday =
    getMonday(new Date());

  const sunday =
    new Date(monday);

  sunday.setDate(
    monday.getDate() + 6
  );


  const start =
    monday.toLocaleDateString(
      "en-US",
      {
        month: "short",
        day: "numeric"
      }
    );


  const end =
    sunday.toLocaleDateString(
      "en-US",
      {
        month: "short",
        day: "numeric"
      }
    );


  weekLabel.textContent =
    start + " — " + end;

}


/* ---------------- RENDER WEEKLY TASKS ---------------- */

function renderWeeklyTodos() {

  weeklyTodoList.innerHTML =
    "";

  const tasks =
    getWeeklyTasks();


  tasks.forEach(
    (task, index) => {

      const row =
        document.createElement("div");

      row.className =
        "weekly-task";


      if (task.completed) {

        row.classList.add(
          "completed"
        );

      }


      /* CHECKBOX */

      const checkbox =
        document.createElement("input");

      checkbox.type =
        "checkbox";

      checkbox.checked =
        task.completed;


      checkbox.addEventListener(
        "change",
        () => {

          const tasks =
            getWeeklyTasks();

          tasks[index].completed =
            checkbox.checked;

          saveWeeklyTasks(tasks);

          renderWeeklyTodos();

        }
      );


      /* EDITABLE TEXT */

      const textInput =
        document.createElement("input");

      textInput.type =
        "text";

      textInput.className =
        "weekly-task-text";

      textInput.value =
        task.text;


      textInput.addEventListener(
        "input",
        () => {

          const tasks =
            getWeeklyTasks();

          tasks[index].text =
            textInput.value;

          saveWeeklyTasks(tasks);

        }
      );


      /* DELETE */

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "weekly-delete-task";

      deleteButton.textContent =
        "×";


      deleteButton.addEventListener(
        "click",
        () => {

          const tasks =
            getWeeklyTasks();

          tasks.splice(
            index,
            1
          );

          saveWeeklyTasks(tasks);

          renderWeeklyTodos();

        }
      );


      row.appendChild(
        checkbox
      );

      row.appendChild(
        textInput
      );

      row.appendChild(
        deleteButton
      );


      weeklyTodoList.appendChild(
        row
      );

    }
  );

}


    /* ---------------- ADD WEEKLY TASK ---------------- */
    
    function addWeeklyTask() {
    
      const text =
        newWeeklyTaskInput.value.trim();
    
      if (!text) {
        return;
      }
    
    
      const tasks =
        getWeeklyTasks();
    
    
      tasks.push({
    
        text: text,
        completed: false
    
      });
    
    
      saveWeeklyTasks(tasks);
    
    
      newWeeklyTaskInput.value =
        "";
    
    
      renderWeeklyTodos();
    
      newWeeklyTaskInput.focus();
    
    }
    
    
    addWeeklyTaskButton.addEventListener(
      "click",
      addWeeklyTask
    );
    
    
    newWeeklyTaskInput.addEventListener(
      "keydown",
      event => {
    
        if (event.key === "Enter") {
    
          addWeeklyTask();
    
        }
    
      }
    );
    
    
    renderWeekLabel();
    renderWeeklyTodos();
  /* =====================================================
     START
     ===================================================== */

  renderCalendar();

  renderTodos();

</script>
