<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Városliget</title>

  <style>
    body {
      background-color: #fdfdfd;
      font-family: "Courier New", monospace;
      padding: 40px;
      color: #222;
    }

    h1 {
      color: darkblue;
    }

    nav a {
      color: darkgreen;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    #loginView {
      max-width: 400px;
      margin-top: 60px;
    }

    #password {
      font-family: inherit;
      font-size: 16px;
      padding: 8px;
      width: 250px;
      max-width: 90%;
      box-sizing: border-box;
    }

    button {
      font-family: inherit;
      padding: 8px 14px;
      cursor: pointer;
      margin-top: 10px;
    }

    #errorMessage {
      color: darkred;
      margin-top: 15px;
    }

    #articleContent {
      white-space: pre-wrap;
      line-height: 1.5;
      margin-top: 30px;
      max-width: 900px;
    }

    #logoutBtn {
      margin-top: 40px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- ===================== -->
  <!-- LOGIN SCREEN          -->
  <!-- ===================== -->

  <div id="loginView">

    <h1>Városliget</h1>

    <nav>
      <a href="thoughts.html">← Back to my thoughts</a>
    </nav>

    <p>This page is private.</p>

    <form id="loginForm">

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <br>

      <button id="loginBtn" type="submit">
        Enter
      </button>

    </form>

    <p id="errorMessage"></p>

  </div>


  <!-- ===================== -->
  <!-- PRIVATE ARTICLE       -->
  <!-- ===================== -->

  <div id="articleView" hidden>

    <h1 id="articleTitle">Városliget</h1>

    <nav>
      <a href="thoughts.html">← Back to my thoughts</a>
    </nav>

    <div id="articleContent"></div>

    <button id="logoutBtn">
      Logout
    </button>

  </div>


  <!-- ===================== -->
  <!-- FIREBASE              -->
  <!-- ===================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      setPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


    // =====================================================
    // YOUR FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain: "YOUR_PROJECT.firebaseapp.com",

      projectId: "YOUR_PROJECT_ID",

      storageBucket: "YOUR_PROJECT.firebasestorage.app",

      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

      appId: "YOUR_APP_ID"

    };


    // =====================================================
    // THE FIREBASE ACCOUNT USED FOR THIS PAGE
    //
    // This email is NOT secret.
    // Only the password is secret.
    // =====================================================

    const READER_EMAIL = "reader@example.com";


    // =====================================================
    // FIREBASE SETUP
    // =====================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // Login lasts only for the current browser session.
    await setPersistence(
      auth,
      browserSessionPersistence
    );


    // =====================================================
    // HTML ELEMENTS
    // =====================================================

    const loginView =
      document.getElementById("loginView");

    const articleView =
      document.getElementById("articleView");

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const passwordInput =
      document.getElementById("password");

    const errorMessage =
      document.getElementById("errorMessage");

    const articleTitle =
      document.getElementById("articleTitle");

    const articleContent =
      document.getElementById("articleContent");

    const logoutBtn =
      document.getElementById("logoutBtn");


    // =====================================================
    // LOGIN
    // =====================================================

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        errorMessage.textContent = "";

        loginBtn.disabled = true;

        loginBtn.textContent = "Checking...";


        try {

          await signInWithEmailAndPassword(
            auth,
            READER_EMAIL,
            passwordInput.value
          );

          passwordInput.value = "";

        }

        catch (error) {

          console.error(error);

          errorMessage.textContent =
            "Incorrect password.";

        }

        finally {

          loginBtn.disabled = false;

          loginBtn.textContent = "Enter";

        }

      }
    );


    // =====================================================
    // LOAD PRIVATE ARTICLE
    // =====================================================

    async function loadArticle() {

      articleContent.textContent =
        "Loading...";

      try {

        const articleRef = doc(
          db,
          "articles",
          "varosliget"
        );


        const snapshot =
          await getDoc(articleRef);


        if (!snapshot.exists()) {

          articleContent.textContent =
            "Article not found.";

          return;

        }


        const data = snapshot.data();


        articleTitle.textContent =
          data.title || "Városliget";


        // IMPORTANT:
        // textContent means the article is treated as text,
        // not executable HTML.

        articleContent.textContent =
          data.content || "";

      }

      catch (error) {

        console.error(error);

        articleContent.textContent =
          "You do not have permission to view this article.";

      }

    }


    // =====================================================
    // AUTH STATE
    // =====================================================

    onAuthStateChanged(
      auth,
      async (user) => {

        if (user) {

          loginView.hidden = true;

          articleView.hidden = false;

          await loadArticle();

        }

        else {

          articleView.hidden = true;

          loginView.hidden = false;

          articleContent.textContent = "";

        }

      }
    );


    // =====================================================
    // LOGOUT
    // =====================================================

    logoutBtn.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );

  </script>

</body>
</html>
